name: 📰 Daily Market Report

on:
  schedule:
    # Taiwan time 07:00, 08:00, 09:00.
    - cron: "0 23,0,1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in Asia/Taipei, YYYY-MM-DD. Leave blank for today."
        required: false
        default: ""
      run_hour:
        description: "Taiwan-hour label for the run, e.g. 7, 8, 9. Leave blank to use current Taiwan hour."
        required: false
        default: ""

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL || 'gpt-4.1-mini' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_DATE_INPUT: ${{ github.event.inputs.date || '' }}
          RUN_HOUR_INPUT: ${{ github.event.inputs.run_hour || '' }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          target_date="${TARGET_DATE_INPUT:-$(TZ=Asia/Taipei date '+%Y-%m-%d')}"
          run_hour="${RUN_HOUR_INPUT:-$(TZ=Asia/Taipei date '+%H')}"

          echo "[DAILY] target_date=${target_date} run_hour=${run_hour}"
          python scraper/daily_report_update.py --date "$target_date" --run-hour "$run_hour" || echo "[WARN] daily report exited non-zero"

          git add docs/daily_news.json docs/daily_scrape_logs.json
          if git diff --cached --quiet; then
            echo "No daily report changes."
          else
            git commit -m "data: daily report ${target_date} ${run_hour}:00 TST"
            git pull --rebase origin main
            git push
          fi

          git clone "https://x-access-token:${GH_PAT}@github.com/dylanlu0604-dot/finnews24hr-page.git" /tmp/page-repo
          git -C /tmp/page-repo config user.name  "github-actions[bot]"
          git -C /tmp/page-repo config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/index.html docs/daily_news.json docs/daily_scrape_logs.json /tmp/page-repo/
          git -C /tmp/page-repo add index.html daily_news.json daily_scrape_logs.json
          if git -C /tmp/page-repo diff --cached --quiet; then
            echo "No page changes."
          else
            git -C /tmp/page-repo commit -m "page: daily report ${target_date} ${run_hour}:00 TST"
            git -C /tmp/page-repo pull --rebase origin main
            git -C /tmp/page-repo push
          fi
