name: 🕐 Financial News Scraper

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "scraper/fetch_sina.py"
      - "scraper/fetch_capital_calendar.py"
      - "docs/index.html"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
    inputs:
      ai_score_backfill_days:
        description: "一次性回補 AI 摘要＋分數的天數；排程執行請留空"
        required: false
        default: ""
      clear_recent_summary_days:
        description: "清除最近 N 天 AI 摘要，讓下次執行重新產生；排程執行請留空"
        required: false
        default: ""
      central_bank_backfill_days:
        description: "一次性回補央行摘要的天數；排程執行請留空"
        required: false
        default: ""

concurrency:
  group: scraper
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL || 'gpt-4.1-mini' }}
          AI_SCORE_BACKFILL_DAYS: ${{ github.event.inputs.ai_score_backfill_days || '' }}
          CLEAR_RECENT_SUMMARY_DAYS: ${{ github.event.inputs.clear_recent_summary_days || '' }}
          CENTRAL_BANK_BACKFILL_DAYS: ${{ github.event.inputs.central_bank_backfill_days || '' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone 公開 page repo
          git clone "https://x-access-token:${GH_PAT}@github.com/dylanlu0604-dot/finnews24hr-page.git" /tmp/page-repo
          git -C /tmp/page-repo config user.name  "github-actions[bot]"
          git -C /tmp/page-repo config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$AI_SCORE_BACKFILL_DAYS" ] || [ -n "$CLEAR_RECENT_SUMMARY_DAYS" ] || [ -n "$CENTRAL_BANK_BACKFILL_DAYS" ]; then
            rounds=1
            if [ -n "$AI_SCORE_BACKFILL_DAYS" ]; then
              echo "[BACKFILL] one-shot AI summary + score backfill for ${AI_SCORE_BACKFILL_DAYS} days"
            fi
            if [ -n "$CLEAR_RECENT_SUMMARY_DAYS" ]; then
              echo "[CLEANUP] one-shot recent AI summary cleanup for ${CLEAR_RECENT_SUMMARY_DAYS} days"
            fi
            if [ -n "$CENTRAL_BANK_BACKFILL_DAYS" ]; then
              echo "[BACKFILL] one-shot central bank summary backfill for ${CENTRAL_BANK_BACKFILL_DAYS} days"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            rounds=1
            echo "[PUSH] code change detected; running one scraper round"
          else
            rounds=20
          fi

          for i in $(seq 1 "$rounds"); do
            echo "=== Round $i ==="
            python scraper/fetch_sina.py || echo "[WARN] scraper failed"

            git add docs/data.json docs/ai_summaries.json docs/central_bank_summaries.json docs/economic_calendar.json docs/market.json
            if git diff --cached --quiet; then
              echo "No changes."
            else
              git commit -m "data: round $i [$(date -u '+%H:%M:%S UTC')]"
              git pull --rebase origin main
              git push

              # 同步 docs/ 到公開 repo
              cp docs/index.html docs/data.json docs/ai_summaries.json docs/central_bank_summaries.json docs/economic_calendar.json docs/market.json /tmp/page-repo/
              git -C /tmp/page-repo add .
              if ! git -C /tmp/page-repo diff --cached --quiet; then
                git -C /tmp/page-repo commit -m "page: round $i [$(date -u '+%H:%M:%S UTC')]"
                git -C /tmp/page-repo pull --rebase origin main
                git -C /tmp/page-repo push
              fi
            fi

            [ $i -lt "$rounds" ] && sleep 180 || true
          done
